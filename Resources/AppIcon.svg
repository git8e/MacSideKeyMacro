<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B8DFF"/>
      <stop offset="1" stop-color="#16276F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E1EE"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#050F3A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS 圆角方形底板 -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#sheen)"/>
  <rect x="40" y="40" width="944" height="944" rx="218" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- 鼠标主体 -->
  <g filter="url(#shadow)">
    <rect x="337" y="248" width="350" height="528" rx="175" fill="url(#body)"/>
  </g>

  <!-- 左右键分缝 -->
  <path d="M512 254 V 472" stroke="#B6C0D2" stroke-width="10" stroke-linecap="round"/>

  <!-- 滚轮 -->
  <rect x="497" y="302" width="30" height="78" rx="15" fill="#2F6BFF"/>

  <!-- 侧键（高亮） -->
  <g filter="url(#glow)">
    <rect x="326" y="358" width="48" height="98" rx="24" fill="#00E5FF"/>
    <rect x="326" y="488" width="48" height="98" rx="24" fill="#00E5FF"/>
  </g>
</svg>
