name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 创建 Release 需要写 contents 权限（默认 token 只读会被 403 拒绝）。
permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Parser self-test
        run: .build/release/sidekey-macro --self-test

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          echo "Stamped app version $VERSION"

      - name: Package .app
        run: ./Scripts/package_app.sh release

      - name: Zip artifact
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MacSideKeyMacro.app MacSideKeyMacro-macOS.zip

      - name: Build DMG
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/MacSideKeyMacro.app/Contents/Info.plist)"
          ./Scripts/make_dmg.sh "dist/MacSideKeyMacro.app" "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MacSideKeyMacro-macOS
          path: |
            dist/MacSideKeyMacro-macOS.zip
            dist/MacSideKeyMacro-*.dmg
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/MacSideKeyMacro-*.dmg
            dist/MacSideKeyMacro-macOS.zip
          generate_release_notes: true
          body: |
            ### 下载

            下载 `MacSideKeyMacro-<版本>.dmg`，双击打开后把 `MacSideKeyMacro` 拖进「应用程序」即可。
            Release 里也附了 `MacSideKeyMacro-macOS.zip`（解压后同样拖进「应用程序」）。

            ### 安装

            1. 首次打开：右键 App → 「打开」；如果提示「已损坏」，执行
               `xattr -dr com.apple.quarantine /Applications/MacSideKeyMacro.app`
            2. 系统设置 → 隐私与安全性 → 辅助功能 → 「+」添加 `MacSideKeyMacro` 并勾选
            3. 回到应用点「刷新状态」，绿点亮起后即可使用
            4. 语言默认跟随系统，可在「设置 → 语言」切换（简体中文 / 繁體中文 / English）

            > macOS 未做正式签名/公证（ad-hoc 签名），第 1 步属正常现象。
